global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: [prometheus:9090]}]
  - job_name: rails
    metrics_path: /metrics
    static_configs: [{targets: [web:3000]}]
  - job_name: yolo
    metrics_path: /metrics
    static_configs: [{targets: [yolo-service:8000]}]
  - job_name: upscale
    metrics_path: /metrics
    static_configs: [{targets: [upscale-service:8000]}]
  - job_name: mongodb
    static_configs: [{targets: [mongodb-exporter:9216]}]
  - job_name: redis
    static_configs: [{targets: [redis-exporter:9121]}]
  - job_name: containers
    static_configs: [{targets: [cadvisor:8080]}]
  - job_name: host
    static_configs: [{targets: [node-exporter:9100]}]
  - job_name: alloy
    static_configs: [{targets: [alloy:12345]}]
